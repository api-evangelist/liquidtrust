  name: LiquidTrust API
  description: The LiquidTrust API lets platform partners embed conditional payment logic - Micro
    Escrow(R) holds, milestone approvals, and rule-based release - directly into their own product,
    with LiquidTrust handling compliance and fund flows. The API host is live and returns standards
    aligned response headers (Deprecation, Sunset, Link, traceparent), but the interface is
    access-gated - onboarding runs through sales rather than a self-serve developer portal, and no
    OpenAPI description, reference documentation, or sandbox is published publicly.
