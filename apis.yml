aid: liquidtrust
name: LiquidTrust
description: LiquidTrust, operated by Liquid Global, Inc., is a B2B payments platform that embeds trust
  and conditionality directly into the payment flow. Its core product, Micro Escrow(R), holds funds and
  releases them against defined conditions such as milestones, approvals, and deliveries, giving buyers
  and sellers recourse without a traditional escrow agent. The platform bundles KYC/KYB, AML and
  sanctions screening into the payment rails and settles to 200+ countries, with J.P. Morgan named as a
  payment-rails partner. LiquidTrust is sold to marketplaces, banks, and platform partners through three
  integration models - referral, white-label, and a direct API integration that embeds conditional
  payment logic into a partner platform. Pricing is a flat 1% all-in per protected transaction, with a
  $10 flat Simple Pay option for lower-risk transfers. The API surface at api.liquidtrust.io is live but
  access-gated behind sales onboarding; no public developer portal, OpenAPI description, SDKs, or
  sandbox documentation is published at this time.
